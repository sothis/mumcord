ight 😄</p></div></div></div></li><li class="chat-message chat-message--start"><div class="chat-message__row"><div class="chat-message__gutter"><span class="avatar" data-size="md" data-initial="B" style="--avatar-bg: var(--color-avatar-8)" aria-hidden="true"></span></div><div class="chat-message__content"><div class="chat-message__header"><span class="chat-message__sender">Ben</span><time class="chat-message__time">07:41</time></div><div class="chat-message__body"><p>On my way.</p></div></div></div></li></ul></div></div><form class="chat-composer" aria-label="Message composer"><div class="chat-composer__row"><div class="chat-apps"><button type="button" class="chat-composer__icon chat-apps__button" aria-label="Apps" aria-expanded="true"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button><div class="server-menu chat-apps__menu" role="menu" aria-label="Start something"><button type="button" role="menuitem" class="server-menu__item mock-appitem"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span class="mock-appitem__body"><span class="mock-appitem__label">Share screen</span></span></button><button type="button" role="menuitem" class="server-menu__item mock-appitem"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"/></svg><span class="mock-appitem__body"><span class="mock-appitem__label">Watch together</span></span></button><button type="button" role="menuitem" class="server-menu__item mock-appitem mock-new-outline"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"
