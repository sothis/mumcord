<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start from a channel – Whiteboard (0.7.0) mockup</title>
<!-- Same fonts the app bundles via @fontsource (not installed for static mockups); Caveat is bundled in the plugin's web/ folder. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:wght@400..700&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="../../../ui/src/theme/global.css">
<link rel="stylesheet" href="../../../ui/src/app/shell.css">
<link rel="stylesheet" href="../../../ui/src/features/app/app.css">
<link rel="stylesheet" href="../../../ui/src/features/servers/servers.css">
<link rel="stylesheet" href="../../../ui/src/features/channels/channels.css">
<link rel="stylesheet" href="../../../ui/src/features/members/members.css">
<link rel="stylesheet" href="../../../ui/src/features/chat/chat.css">
<link rel="stylesheet" href="../../../ui/src/features/chat/chatActionRow.css">
<link rel="stylesheet" href="../../../ui/src/features/chat/mediaCards.css">
<link rel="stylesheet" href="../../../ui/src/features/media/media.css">
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="whiteboard.css">
<!-- ?theme=light switches to the light theme, like the app's data-theme on <html>. -->
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || "dark";</script>
</head>
<body>
<div class="shell" style="--channels-width: 16.5rem; --members-column-width: 0px">
  <nav class="shell__servers" aria-label="Servers"><div class="server-bar"><ul class="server-bar__list"><li class="server-bar__item" data-active><button class="server-bar__server mock-server mock-server--active" type="button" aria-label="Mumcord Lounge">ML</button></li><li class="server-bar__item"><button class="server-bar__server mock-server" type="button" aria-label="Game Night">GN</button></li><li class="server-bar__item"><button class="server-bar__server mock-server" type="button" aria-label="Study Group">SG</button></li></ul></div></nav>
  <div class="shell__channel-column" aria-label="Channels">
    <div class="mock-section"><h2 class="server-section__title"><span class="server-section__dot"></span><span class="server-section__name">Mumcord Lounge</span></h2></div>
    <ul class="mock-tree"><li class="mock-channel"><div class="tree-channel__row"><span class="tree-channel__glyph"><span class="mock-hash">#</span></span><span class="tree-channel__label"><span class="tree-channel__name">Lobby</span></span></div></li>
<li class="mock-channel" style="position:relative"><div class="tree-channel__row" data-here><span class="tree-channel__glyph"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span><span class="tree-channel__label"><span class="tree-channel__name">General</span></span></div><div class="server-menu wb-chanmenu" role="menu" aria-label="Channel General"><button class="server-menu__item " role="menuitem" type="button"><span class="mock-menu-icon"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span><span class="server-menu__text">Join channel</span></button><button class="server-menu__item " role="menuitem" type="button"><span class="mock-menu-icon"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3A4 4 0 0011 18.7l1-1"/></svg></span><span class="server-menu__text">Copy channel link</span></button><button class="server-menu__item " role="menuitem" type="button"><span class="mock-menu-icon"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg></span><span class="server-menu__text">Edit channel…</span></button><hr class="mock-menu-sep"><button class="server-menu__item mock-focus mock-new" role="menuitem" type="button"><span class="mock-menu-icon"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 14c2-5 3 1 5-3s3 2 5-2"/><path d="M8 21h8"/></svg></span><span class="server-menu__text">Start whiteboard here</span><span class="mock-new-badge">new</span></button></div><ul class="mock-people"><li class="tree-person mock-person"><span class="tree-person__row" style="padding-right:var(--space-2)"><span class="avatar" data-size="sm" data-initial="M" style="--avatar-bg: var(--color-avatar-2)" aria-hidden="true"></span><span class="tree-person__name">Maya</span></span></li><li class="tree-person mock-person"><span class="tree-person__row" style="padding-right:var(--space-2)"><span class="avatar" data-size="sm" data-initial="B" style="--avatar-bg: var(--color-avatar-8)" aria-hidden="true"></span><span class="tree-person__name">Bob <span class="tree-person__you">(you)</span></span></span></li><li class="tree-person mock-person"><span class="tree-person__row" style="padding-right:var(--space-2)"><span class="avatar" data-size="sm" data-initial="B" style="--avatar-bg: var(--color-avatar-1)" aria-hidden="true"></span><span class="tree-person__name">Ben</span></span></li><li class="tree-person mock-person"><span class="tree-person__row" style="padding-right:var(--space-2)"><span class="avatar" data-size="sm" data-initial="L" style="--avatar-bg: var(--color-avatar-6)" aria-hidden="true"></span><span class="tree-person__name">Leo</span></span></li><li class="tree-person mock-person"><span class="tree-person__row" style="padding-right:var(--space-2)"><span class="avatar" data-size="sm" data-initial="Z" style="--avatar-bg: var(--color-avatar-5)" aria-hidden="true"></span><span class="tree-person__name">Zoe</span></span></li><li class="tree-person mock-person"><span class="tree-person__row" style="padding-right:var(--space-2)"><span class="avatar" data-size="sm" data-initial="S" style="--avatar-bg: var(--color-avatar-3)" aria-hidden="true"></span><span class="tree-person__name">Sam</span></span></li></ul></li>
<li class="mock-channel"><div class="tree-channel__row"><span class="tree-channel__glyph"><span class="mock-hash">#</span></span><span class="tree-channel__label"><span class="tree-channel__name">Music</span></span></div></li>
<li class="mock-channel"><div class="tree-channel__row"><span class="tree-channel__glyph"><span class="mock-hash">#</span></span><span class="tree-channel__label"><span class="tree-channel__name">AFK</span></span></div></li></ul>
    <section class="shell__user-panel mock-userpanel" aria-label="You"><span class="avatar" data-size="md" data-initial="B" style="--avatar-bg: var(--color-avatar-8)" aria-hidden="true"></span><span><strong>Bob</strong><br><span class="mock-muted">In General</span></span></section>
  </div>
  <main class="shell__chat" aria-label="Chat">
  <header class="chat-header"><h2 class="chat-header__title"><span class="chat-header__hash" aria-hidden="true">#</span>General</h2></header>
  <div class="shell__chat-body"><div class="chat-list-frame"><div class="chat-list"><ul class="chat-list__items"><li class="chat-message chat-message--start"><div class="chat-message__row"><div class="chat-message__gutter"><span class="avatar" data-size="md" data-initial="M" style="--avatar-bg: var(--color-avatar-2)" aria-hidden="true"></span></div><div class="chat-message__content"><div class="chat-message__header"><span class="chat-message__sender">Maya</span><time class="chat-message__time">13:58</time></div><div class="chat-message__body"><p>ok let's sketch the launch week, hang on</p></div></div></div></li></ul></div></div><form class="chat-composer" aria-label="Message composer"><div class="chat-composer__row">
    <div class="chat-apps"><button type="button" class="chat-composer__icon chat-apps__button" aria-label="Apps"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <textarea class="chat-composer__input" rows="1" aria-label="Message #General" placeholder="Message #General"></textarea>
    <button type="submit" class="chat-composer__icon" aria-label="Send"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
  </div></form></div>
  </main>
</div>
</body>
</html>
